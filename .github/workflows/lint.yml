name: lint

on:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Markdown
        run: npm run lint:md
      - name: TypeScript
        run: npm run lint:ts
      - name: YAML
        run: npm run lint:yaml
